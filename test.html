<!DOCTYPE html>
<html>
<head>
<script>
function openMainTab(tabId, btn) {
    document.querySelectorAll('.main-tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(btn) btn.classList.add('active');
}

function openProjectTab(tabId, btn) {
    document.querySelectorAll('.project-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.project-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(btn) btn.classList.add('active');
}
</script>
<style>
.active { background: yellow !important; }
</style>
</head>
<body>
<div class="main-tabs">
    <button class="main-tab-btn active" onclick="openMainTab('projects', this)">Projects</button>
    <button class="main-tab-btn" onclick="openMainTab('reviews', this)">Reviews</button>
</div>
<div id="projects" class="main-tab-content active">Projects content</div>
<div id="reviews" class="main-tab-content">Reviews content</div>

<div class="project-tabs">
    <button class="project-tab-btn active" onclick="openProjectTab('p1', this)">P1</button>
    <button class="project-tab-btn" onclick="openProjectTab('p2', this)">P2</button>
</div>
<div id="p1" class="project-content active">Project 1</div>
<div id="p2" class="project-content">Project 2</div>
</body>
</html>
